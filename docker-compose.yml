services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "8081:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.server
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "4000"
    expose:
      - "4000"
    volumes:
      - ./db.json:/app/db.json
    restart: unless-stopped
